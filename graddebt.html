<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GradDebt Reality Check — Is your degree working against you?</title>

<meta property="og:title" content="Is your degree working against you?" />
<meta property="og:description" content="Graduates in India face 29.1% unemployment. Illiterates face 3.4%. Find your Degree Risk Score in 45 seconds." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FFFDF2;
    --ink:#111111;
    --red:#FF2D2D;
    --yellow:#FFE000;
    --blue:#2F6BFF;
    --green:#22C55E;
    --orange:#FF7A00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;}
  .display{font-family:'Archivo Black',system-ui,sans-serif;letter-spacing:-0.02em;line-height:0.92;}
  .brut{border:3.5px solid var(--ink);box-shadow:7px 7px 0 var(--ink);}
  .brut-sm{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);}
  .brut-press{transition:transform .07s ease, box-shadow .07s ease;}
  .brut-press:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink);}
  .noscroll{overflow:hidden;}
  .fadein{animation:fadein .5s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .marquee{white-space:nowrap;overflow:hidden;}
  .marquee>span{display:inline-block;animation:scrollx 18s linear infinite;}
  @keyframes scrollx{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .hidecap{position:absolute;left:-9999px;top:0;}
  ::selection{background:var(--yellow);}
  button{font-family:inherit;cursor:pointer;}
  .opt-btn{font-weight:700;}
  .opt-sel{background:var(--ink);color:var(--paper);}
  .grain{background-image:radial-gradient(var(--ink) 0.5px, transparent 0.5px);background-size:14px 14px;opacity:0.04;position:fixed;inset:0;pointer-events:none;z-index:0;}
</style>
</head>
<body>
<div class="grain"></div>
<div id="app" class="relative" style="z-index:1;max-width:560px;margin:0 auto;min-height:100vh;"></div>

<!-- offscreen share card target -->
<div id="cardWrap" class="hidecap"></div>

<script>
/* ============================================================
   DATA — every number traces to the source doc (PLFS / ILO / CMIE / World Bank)
   ============================================================ */
const STAT = {
  gradUnemp: 29.1,        // ILO India Employment Report 2024
  illiterateUnemp: 3.4,   // ILO 2024 (graduates ~9x illiterates)
  educShare2000: 35.2,    // educated among unemployed, 2000
  educShare2022: 65.7,    // educated among unemployed, 2022 (PLFS)
  jobReady: "48–50%",     // share of grads industry calls job-ready
  urbanYouthJul25: 19,    // urban youth unemployment, Jul 2025
  national: 5.1,          // overall, Mar 2026 (CMIE)
  underemployed: 62.3,    // ILO/CMIE 2025
  femaleEducShare: 76.7,  // women = 76.7% of educated unemployed youth
  selfEmployed: 56.2,     // PLFS 2025
  salaried: 23.6          // regular/salaried, PLFS 2025
};
const MULT = (STAT.gradUnemp / STAT.illiterateUnemp).toFixed(1); // ~8.6 ≈ "nearly 9x"

/* State youth-unemployment buckets (Q2 2025, PLFS). Elevated states get higher regional risk. */
const STATES = {
  "Himachal Pradesh":{r:10,rate:29.6}, "Punjab":{r:10,rate:20.2}, "Haryana":{r:9,rate:15.6},
  "Kerala":{r:8,rate:null}, "Rajasthan":{r:7,rate:null}, "Uttar Pradesh":{r:7,rate:null},
  "Bihar":{r:7,rate:null}, "Odisha":{r:6,rate:null}, "Andhra Pradesh":{r:6,rate:null},
  "Telangana":{r:6,rate:null}, "Tamil Nadu":{r:6,rate:null}, "West Bengal":{r:6,rate:null},
  "Maharashtra":{r:6,rate:null}, "Karnataka":{r:5,rate:null}, "Delhi":{r:6,rate:null},
  "Gujarat":{r:4,rate:null}, "Madhya Pradesh":{r:6,rate:null}, "Other / Not listed":{r:6,rate:null}
};

/* Field weights — illustrative ordering anchored to the "~half are job-ready" finding.
   Disclosed as the soft factor in Methodology. */
const FIELDS = {
  "Engineering / B.Tech":{w:10,label:"Engineering"},
  "Arts / Humanities":{w:14,label:"Arts/Humanities"},
  "Commerce / B.Com":{w:9,label:"Commerce"},
  "Science (B.Sc/M.Sc)":{w:12,label:"Science"},
  "Management / MBA":{w:8,label:"Management"},
  "Law":{w:7,label:"Law"},
  "Medicine / Nursing / Allied":{w:2,label:"Medicine/Allied"},
  "Vocational / Diploma trade":{w:4,label:"Vocational"},
  "Other":{w:9,label:"Other"}
};
const LEVELS = {
  "Diploma / ITI":{w:8}, "Bachelor's":{w:18}, "Master's":{w:22}, "PhD":{w:20}
};
const YEARS = {
  "2024–2026":{w:14}, "2020–2023":{w:12}, "2015–2019":{w:7}, "Before 2015":{w:3}
};
const STATUS = {
  "Employed, in my field":{w:-10}, "Employed, outside my field":{w:6},
  "Underemployed / gig / part-time":{w:14}, "Still job-hunting":{w:20},
  "Studying further (no job yet)":{w:8}
};

/* ============================================================
   STATE
   ============================================================ */
let answers = { field:null, level:null, year:null, state:null, status:null };
let step = 0; // 0 = landing
const QORDER = ["field","level","year","state","status"];

const QMETA = {
  field:{q:"What did you study?", sub:"Your main field of study.", opts:Object.keys(FIELDS)},
  level:{q:"How far did you go?", sub:"Highest qualification.", opts:Object.keys(LEVELS)},
  year:{q:"When did you finish?", sub:"Roughly the year you graduated.", opts:Object.keys(YEARS)},
  state:{q:"Where are you based?", sub:"Your state shapes your odds.", opts:Object.keys(STATES)},
  status:{q:"Where are you right now?", sub:"Be honest — this matters most.", opts:Object.keys(STATUS)}
};

/* ============================================================
   SCORING — bulk of the score comes from citable factors.
   ============================================================ */
function computeScore(){
  let s = 18;
  s += LEVELS[answers.level].w;
  s += FIELDS[answers.field].w;
  s += YEARS[answers.year].w;
  s += STATUS[answers.status].w;
  s += STATES[answers.state].r;
  return Math.max(8, Math.min(96, Math.round(s)));
}
function tierFor(score){
  if(score>=75) return {name:"WORKING AGAINST YOU", color:"var(--red)", txt:"#fff", emoji:"🔥"};
  if(score>=55) return {name:"HIGH RISK", color:"var(--orange)", txt:"#111", emoji:"⚠️"};
  if(score>=38) return {name:"TREADING WATER", color:"var(--yellow)", txt:"#111", emoji:"😬"};
  return {name:"HOLDING UP", color:"var(--green)", txt:"#111", emoji:"✅"};
}
function verdictLine(score, tier){
  const f = FIELDS[answers.field].label;
  if(score>=75) return `Your ${f} degree is a liability in today's market, not an asset.`;
  if(score>=55) return `Your ${f} degree is exposed — the system isn't hiring what it trained you for.`;
  if(score>=38) return `Your ${f} degree barely keeps pace with India's jobless growth.`;
  return `Your ${f} degree is holding up — rarer than you'd think in India right now.`;
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */
const app = document.getElementById('app');
function go(n){ step=n; render(); window.scrollTo(0,0); }

function pickStat(){
  // tailor the "surprising context" line to the user
  const lvl = answers.level;
  if(lvl==="Master's"||lvl==="PhD")
    return `You went further than most — yet in India the educated are now <b>${STAT.educShare2022}%</b> of the unemployed, up from ${STAT.educShare2000}% in 2000. Extra degrees, less protection.`;
  if(answers.status==="Still job-hunting")
    return `You're not failing — the math is. Only <b>${STAT.jobReady}</b> of Indian graduates are rated "job-ready" by the industry that's supposed to hire them.`;
  return `A graduate in India faces <b>${STAT.gradUnemp}%</b> unemployment. Someone with no schooling faces <b>${STAT.illiterateUnemp}%</b>. The degree multiplied the risk ~${MULT}×.`;
}

/* ============================================================
   SCREENS
   ============================================================ */
function render(){
  if(step===0) return renderLanding();
  if(step>=1 && step<=5) return renderQuestion(QORDER[step-1]);
  if(step===6) return renderLoading();
  if(step===7) return renderResult();
}

function renderLanding(){
  app.innerHTML = `
  <div class="px-5 pt-6 pb-10 fadein">
    <div class="brut-sm bg-[var(--yellow)] px-3 py-1.5 inline-block mb-6 -rotate-1">
      <span class="display text-[12px] tracking-tight">INDIA · GRADUATE JOBS · 2026</span>
    </div>

    <h1 class="display text-[clamp(40px,12vw,62px)] mb-4">
      IS YOUR<br>DEGREE<br>
      <span class="bg-[var(--red)] text-[var(--paper)] px-2 inline-block -rotate-1">WORKING</span><br>
      AGAINST YOU?
    </h1>

    <p class="text-[17px] font-medium leading-snug mb-6 max-w-[440px]">
      In India, graduates face <b>${STAT.gradUnemp}%</b> unemployment.
      People with no schooling face <b>${STAT.illiterateUnemp}%</b>.
      <span class="bg-[var(--yellow)] px-1">More education = more joblessness.</span>
      Find <i>your</i> Degree Risk Score.
    </p>

    <button onclick="go(1)" class="brut brut-press bg-[var(--ink)] text-[var(--paper)] w-full py-5 mb-4">
      <span class="display text-[20px]">CHECK MY DEGREE →</span>
    </button>

    <div class="flex items-center gap-2 text-[12px] font-semibold opacity-70 mb-8">
      <span>⏱ 45 sec</span><span>·</span><span>5 questions</span><span>·</span><span>🔒 nothing stored</span>
    </div>

    <div class="brut bg-white p-4 -rotate-[0.5deg]">
      <div class="display text-[13px] mb-3 bg-[var(--ink)] text-[var(--paper)] inline-block px-2 py-0.5">THE LOOPHOLE</div>
      <p class="text-[14px] font-medium leading-snug">
        India's universities are designed to hand out <b>degrees</b>, not <b>jobs</b>.
        Curricula are set by bureaucrats and revised roughly once a decade, while industry hires elsewhere.
        Result: the educated are now <b>${STAT.educShare2022}%</b> of the unemployed — up from ${STAT.educShare2000}% in 2000.
      </p>
    </div>

    <p class="text-[11px] font-semibold opacity-50 mt-6 text-center">
      Data: PLFS · ILO India Employment Report 2024 · CMIE · World Bank
    </p>
  </div>`;
}

function renderQuestion(key){
  const meta = QMETA[key];
  const cur = answers[key];
  const opts = meta.opts.map(o=>{
    const sel = cur===o;
    return `<button onclick="pick('${key}',${JSON.stringify(o).replace(/"/g,'&quot;')})"
      class="opt-btn brut-sm brut-press w-full text-left px-4 py-3.5 mb-3 bg-white ${sel?'opt-sel':''}">
      <span class="text-[15.5px]">${o}</span>
    </button>`;
  }).join('');

  const dots = QORDER.map((k,i)=>`<div class="h-2 flex-1 ${i<step?'bg-[var(--ink)]':'bg-[var(--ink)]/15'} ${i<step?'':'border border-[var(--ink)]/30'}"></div>`).join('');

  app.innerHTML = `
  <div class="px-5 pt-6 pb-10 fadein">
    <div class="flex gap-1.5 mb-6">${dots}</div>
    <div class="flex items-center justify-between mb-5">
      <button onclick="go(${step-1})" class="display text-[13px] opacity-60">← BACK</button>
      <span class="display text-[13px]">${step} / 5</span>
    </div>

    <h2 class="display text-[clamp(28px,8vw,38px)] mb-1.5">${meta.q}</h2>
    <p class="text-[14px] font-semibold opacity-60 mb-6">${meta.sub}</p>

    <div>${opts}</div>
  </div>`;
}

function pick(key,val){
  answers[key]=val;
  if(step<5){ setTimeout(()=>go(step+1),140); }
  else { setTimeout(()=>go(6),140); }
}

function renderLoading(){
  go.score = computeScore();
  const msgs = ["Reading your degree…","Cross-checking PLFS data…","Pricing your odds…","Confronting the numbers…"];
  app.innerHTML = `
  <div class="px-5 min-h-screen flex flex-col items-center justify-center text-center">
    <div class="brut bg-[var(--yellow)] w-20 h-20 flex items-center justify-center mb-8">
      <div class="spin display text-[34px]">⟳</div>
    </div>
    <div id="loadmsg" class="display text-[22px] mb-2">${msgs[0]}</div>
    <div class="text-[13px] font-semibold opacity-50">no email · no sign-up · no spin</div>
  </div>`;
  let i=0;
  const t=setInterval(()=>{ i++; const el=document.getElementById('loadmsg');
    if(!el){clearInterval(t);return;} el.textContent=msgs[i%msgs.length]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); },650);
  setTimeout(()=>{clearInterval(t); go(7);},2700);
}

function countUp(el,to){
  let cur=0; const dur=850, t0=performance.now();
  function f(t){ const p=Math.min(1,(t-t0)/dur); cur=Math.round(p*to); el.textContent=cur; if(p<1)requestAnimationFrame(f);}
  requestAnimationFrame(f);
}

function renderResult(){
  const score = computeScore();
  const tier = tierFor(score);
  const fLabel = FIELDS[answers.field].label;
  const stRate = STATES[answers.state].rate;

  app.innerHTML = `
  <div class="px-5 pt-6 pb-12">
    <div class="brut-sm bg-[var(--yellow)] px-2 py-1 inline-block mb-4 -rotate-1">
      <span class="display text-[11px]">GRADDEBT REALITY CHECK</span>
    </div>

    <div class="pop brut p-6 mb-5" style="background:${tier.color};color:${tier.txt};">
      <div class="display text-[14px] mb-1 opacity-90">YOUR DEGREE RISK SCORE</div>
      <div class="flex items-end gap-1">
        <span id="bignum" class="display text-[clamp(80px,26vw,128px)] leading-none">0</span>
        <span class="display text-[34px] mb-3">/100</span>
      </div>
      <div class="display text-[clamp(22px,6.5vw,30px)] mt-1">${tier.emoji} ${tier.name}</div>
    </div>

    <p class="text-[18px] font-bold leading-snug mb-5">${verdictLine(score,tier)}</p>

    <!-- data points -->
    <div class="grid grid-cols-2 gap-3 mb-5">
      ${statBox(STAT.gradUnemp+"%","graduate unemployment (ILO)")}
      ${statBox("~"+MULT+"×","your risk vs an illiterate worker")}
      ${statBox(STAT.educShare2022+"%","of the jobless are educated")}
      ${statBox(stRate?stRate+"%":STAT.urbanYouthJul25+"%", stRate?"youth jobless in "+answers.state:"urban youth jobless, Jul 2025")}
    </div>

    <div class="brut bg-white p-4 mb-5 -rotate-[0.4deg]">
      <div class="display text-[12px] bg-[var(--ink)] text-[var(--paper)] inline-block px-2 py-0.5 mb-2">THE PART NOBODY TELLS YOU</div>
      <p class="text-[14.5px] font-medium leading-snug">${pickStat()}</p>
    </div>

    <div class="brut bg-[var(--blue)] text-white p-4 mb-7">
      <div class="display text-[13px] mb-1.5">WHAT THIS ACTUALLY MEANS</div>
      <p class="text-[14px] font-medium leading-snug">
        This isn't about your effort. It's a <b>governance loophole</b>: India produces degrees the economy was never restructured to hire.
        Until curricula are set with industry and manufacturing actually absorbs graduates, your score is the system's failure — not yours.
      </p>
    </div>

    <!-- share -->
    <div class="display text-[15px] mb-3">SHARE YOUR SCORE 👇</div>
    <button onclick="shareX()" class="brut brut-press bg-[var(--ink)] text-[var(--paper)] w-full py-4 mb-3">
      <span class="display text-[16px]">POST ON X / TWITTER</span>
    </button>
    <button onclick="downloadCard()" class="brut brut-press bg-[var(--yellow)] w-full py-4 mb-3">
      <span class="display text-[16px]">⬇ SAVE CARD FOR INSTAGRAM</span>
    </button>
    <button onclick="restart()" class="brut-sm brut-press bg-white w-full py-3 mb-6">
      <span class="display text-[14px]">↺ CHECK ANOTHER DEGREE</span>
    </button>

    <div id="toast" class="hidden brut-sm bg-[var(--green)] text-white px-4 py-3 text-center font-bold text-[14px] mb-4"></div>

    <button onclick="toggleMethod()" class="display text-[12px] underline opacity-60 w-full text-center">HOW THIS SCORE IS CALCULATED ▾</button>
    <div id="method" class="hidden brut bg-white p-4 mt-3 text-[13px] font-medium leading-relaxed">
      <p class="mb-2"><b>This is an awareness index, not an official forecast.</b> It blends India's real graduate-jobs data with your profile.</p>
      <p class="mb-2"><b>Citable factors (the bulk of your score):</b> qualification level (graduates 29.1% vs illiterates 3.4%, ILO 2024), graduation cohort (urban youth jobless 19%, Jul 2025), current employment status, and your state's youth unemployment (HP 29.6%, Punjab 20.2%, Haryana 15.6% — PLFS Q2 2025).</p>
      <p class="mb-2"><b>Soft factor:</b> field of study is an illustrative weighting anchored to the ~48–50% "job-ready" figure — India publishes no official field-level unemployment rates, so we don't invent them.</p>
      <p class="opacity-70">Sources: PLFS Annual & Monthly (MoSPI) · ILO India Employment Report 2024 · CMIE · World Bank. No inputs are stored.</p>
    </div>

    <p class="text-[11px] font-semibold opacity-40 mt-6 text-center">Made to expose a loophole, not to diagnose you.</p>
  </div>`;

  setTimeout(()=>countUp(document.getElementById('bignum'),score),250);
  buildCard(score,tier);
}

function statBox(big,small){
  return `<div class="brut-sm bg-white p-3">
    <div class="display text-[26px] leading-none mb-1">${big}</div>
    <div class="text-[11.5px] font-semibold opacity-70 leading-tight">${small}</div>
  </div>`;
}

/* ============================================================
   SHARE CARD (1080x1350)
   ============================================================ */
function buildCard(score,tier){
  const fLabel = FIELDS[answers.field].label;
  document.getElementById('cardWrap').innerHTML = `
  <div id="shareCard" style="width:1080px;height:1350px;background:var(--paper);position:relative;font-family:'Space Grotesk',sans-serif;overflow:hidden;">
    <div style="position:absolute;inset:0;background-image:radial-gradient(#111 1px,transparent 1px);background-size:26px 26px;opacity:0.05;"></div>
    <div style="position:relative;padding:70px 64px;height:100%;display:flex;flex-direction:column;">
      <div style="display:inline-block;background:var(--yellow);border:5px solid #111;box-shadow:9px 9px 0 #111;padding:10px 18px;align-self:flex-start;transform:rotate(-2deg);">
        <span class="display" style="font-size:26px;">GRADDEBT REALITY CHECK</span>
      </div>

      <div class="display" style="font-size:62px;margin-top:54px;line-height:0.95;">MY DEGREE<br>RISK SCORE</div>

      <div style="background:${tier.color};color:${tier.txt};border:6px solid #111;box-shadow:14px 14px 0 #111;padding:38px 40px;margin-top:40px;">
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <span class="display" style="font-size:230px;line-height:0.8;">${score}</span>
          <span class="display" style="font-size:64px;margin-bottom:34px;">/100</span>
        </div>
        <div class="display" style="font-size:54px;margin-top:8px;">${tier.emoji} ${tier.name}</div>
      </div>

      <div style="margin-top:46px;display:flex;flex-direction:column;gap:22px;">
        <div style="display:flex;align-items:center;gap:18px;"><span class="display" style="font-size:40px;background:#111;color:var(--paper);padding:4px 14px;">${STAT.gradUnemp}%</span><span style="font-size:30px;font-weight:600;">of Indian graduates are unemployed</span></div>
        <div style="display:flex;align-items:center;gap:18px;"><span class="display" style="font-size:40px;background:#111;color:var(--paper);padding:4px 14px;">~${MULT}×</span><span style="font-size:30px;font-weight:600;">my risk vs someone with no schooling</span></div>
        <div style="display:flex;align-items:center;gap:18px;"><span class="display" style="font-size:40px;background:#111;color:var(--paper);padding:4px 14px;">${STAT.educShare2022}%</span><span style="font-size:30px;font-weight:600;">of India's jobless are educated</span></div>
      </div>

      <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;">
        <div style="font-size:24px;font-weight:700;opacity:0.7;max-width:560px;line-height:1.2;">A governance loophole, not a personal failure.<br>Source: PLFS · ILO 2024 · CMIE</div>
        <div class="display" style="font-size:30px;background:var(--red);color:#fff;padding:10px 16px;transform:rotate(2deg);">CHECK YOURS →</div>
      </div>
    </div>
  </div>`;
}

async function downloadCard(){
  const node=document.getElementById('shareCard');
  try{
    const dataUrl=await htmlToImage.toPng(node,{pixelRatio:1,width:1080,height:1350,backgroundColor:'#FFFDF2'});
    const link=document.createElement('a'); link.download='my-graddebt-score.png'; link.href=dataUrl; link.click();
    // bonus: native share on mobile
    try{
      const blob=await (await fetch(dataUrl)).blob();
      const file=new File([blob],'graddebt-score.png',{type:'image/png'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'GradDebt Reality Check'});
      }
    }catch(e){}
    showToast("Saved! Open Instagram → Story → upload 📲");
  }catch(e){ showToast("Couldn't generate the card — try again."); }
}

function shareX(){
  const score=computeScore(); const tier=tierFor(score);
  const txt=encodeURIComponent(
`My Degree Risk Score is ${score}/100 — "${tier.name}".

In India graduates face ${STAT.gradUnemp}% unemployment vs ${STAT.illiterateUnemp}% for those with no schooling. The degree isn't the problem — the system is.

Check yours 👇`);
  window.open(`https://twitter.com/intent/tweet?text=${txt}`,'_blank');
}

function showToast(msg){
  const t=document.getElementById('toast'); if(!t)return;
  t.textContent=msg; t.classList.remove('hidden'); t.classList.add('pop');
  setTimeout(()=>t.classList.add('hidden'),3200);
}
function toggleMethod(){ document.getElementById('method').classList.toggle('hidden'); }
function restart(){ answers={field:null,level:null,year:null,state:null,status:null}; go(0); }

render();
</script>
</body>
</html>
